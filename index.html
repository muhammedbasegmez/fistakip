/* Ağ hatalarında ve kota/sunucu hatalarında kendiliğinden yeniden dener; model adı bulunamazsa yedek modele geçer */
let rdCancel = false, rdAc = null, onProg = null, bgFlag = false, bgHit = 0;
document.addEventListener('visibilitychange', () => { if (!document.hidden && typeof busy !== 'undefined' && busy && rdAc && !rdCancel) { bgFlag = true; try { rdAc.abort(); } catch(e) {} } });
const cancelErr = () => { const e = new Error('İptal edildi'); e.fatal = true; e.cancel = true; return e; };
async function gemini(body){
  const k = localStorage.getItem('gkey'); if (!k) { const e = new Error('API anahtarı girilmemiş'); e.fatal = true; throw e; }
  const first = (localStorage.getItem('gmodel') || 'gemini-flash-latest').trim();
  const models = [...new Set([first, 'gemini-flash-latest', 'gemini-flash-lite-latest'])];
  let lastErr = null;
  body.generationConfig = body.generationConfig || {};
  if (!body.generationConfig.thinkingConfig && localStorage.getItem('nothink') !== '1') body.generationConfig.thinkingConfig = {thinkingBudget:0};
  for (const m of models) {
    for (let a = 0; a < 3; a++) {
      if (rdCancel) throw cancelErr();
      let r; const ac = new AbortController(); rdAc = ac; const to = setTimeout(() => ac.abort(), 55000);
      onProg && onProg({t:'wait', n:a + 1});
      try { r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,
        {method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':k}, body:JSON.stringify(body), signal:ac.signal}); clearTimeout(to); rdAc = null; }
      catch(e) { clearTimeout(to); if (rdCancel) throw cancelErr();
        if (bgFlag && bgHit < 4) { bgFlag = false; bgHit++; a--; onProg && onProg({t:'retry', note:'Uygulamaya dönüldü, okuma kaldığı yerden yeniden başlıyor'}); await sleep(600); continue; }
        lastErr = new Error(e && e.name === 'AbortError' ? 'Gemini 55 sn içinde cevap vermedi' : 'Google\'a ulaşılamadı (internet?)');
        onProg && onProg({t:'retry', note:lastErr.message + ' — yeniden deneniyor (' + (a + 1) + '/3)'}); await sleep(a ? 6000 : 2500); continue; }
      if (r.ok) return r.json();
      let msg = ''; try { msg = (await r.json()).error.message; } catch(e) {}
      if (r.status === 400 && /think/i.test(msg) && body.generationConfig.thinkingConfig) { delete body.generationConfig.thinkingConfig; try { localStorage.setItem('nothink', '1'); } catch(e) {} a--; continue; }
      if (r.status === 404) { lastErr = new Error('Model bulunamadı: ' + m); break; }
      if (r.status === 429 || r.status >= 500) { lastErr = new Error(r.status === 429 ? 'Ücretsiz kota veya dakikalık sınır doldu' : 'Google geçici hata verdi (' + r.status + ')');
        onProg && onProg({t:'retry', note:lastErr.message + ' — yeniden deneniyor (' + (a + 1) + '/3)'}); await sleep(a ? 9000 : 3000); continue; }
      const e = new Error('Gemini ' + r.status + ': ' + msg); e.fatal = true; throw e;
    }
  }
  throw lastErr || new Error('Bilinmeyen hata');
}
let wl = null;
async function wlOn(){ try { if (navigator.wakeLock) wl = await navigator.wakeLock.request('screen'); } catch(e) {} }
function wlOff(){ try { if (wl) wl.release(); } catch(e) {} wl = null; }

function progStart(title){
  rdCancel = false; bgFlag = false; bgHit = 0; wlOn(); const o = document.createElement('div'); o.id = 'rdov';
  o.innerHTML = `<div class="rdc"><div class="spin"></div><b style="font-size:18px">${esc(title)}</b>
    <div class="stp"><span id="ps1" class="on">Gönder</span><span id="ps2">Oku</span><span id="ps3">Kontrol</span></div>
    <div class="pbar"><i id="pb" style="width:8%"></i></div><div id="pm" style="font-weight:600">Fotoğraf hazırlanıyor…</div><div class="sub" id="pt" style="margin-top:6px"></div>
    <button class="btn alt" data-act="rdcancel">İptal</button></div>`;
  document.body.appendChild(o); const t0 = Date.now(); let step = 1, note = '';
  const set = (n, msg) => { step = n; note = ''; ['ps1', 'ps2', 'ps3'].forEach((id, i) => { const e = $('#' + id); if (e) e.className = i + 1 < n ? 'done' : i + 1 === n ? 'on' : ''; }); const m = $('#pm'); if (m && msg) m.textContent = msg; };
  onProg = ev => { if (ev.t === 'wait' && step < 3) set(2, 'Gemini fişi okuyor…'); else if (ev.t === 'wait' && step === 3) set(3, 'Toplam uyuşmadı, fiş ikinci kez kontrol ediliyor…');
    else if (ev.t === 'second') set(3, 'Toplam uyuşmadı, fiş ikinci kez kontrol ediliyor…'); else if (ev.t === 'retry') { note = ev.note; } };
  const tick = setInterval(() => { const sec = Math.round((Date.now() - t0) / 1000), b = $('#pb'), t = $('#pt'); if (!b) return;
    b.style.width = Math.min(92, (step === 1 ? 10 : step === 2 ? 25 + Math.min(50, sec * 3) : 78 + Math.min(14, sec))) + '%';
    t.innerHTML = `${esc(note) || (sec > 40 ? 'Hâlâ cevap yok. İptal edersen fotoğraf kaybolmaz.' : sec > 20 ? 'Biraz uzadı, Google yoğun olabilir. Bekleyebilir ya da iptal edebilirsin.' : 'Genelde 5–15 saniye sürer.')}<br>Geçen süre: ${sec} sn`; }, 500);
  setTimeout(() => { if (step === 1) set(2, 'Gemini’ye gönderiliyor…'); }, 400);
  return () => { clearInterval(tick); onProg = null; rdCancel = false; rdAc = null; wlOff(); o.remove(); };
}
async function analyze(b64s, hint){
  const parts = [{text:buildPrompt(b64s.length) + (hint || '')}, ...b64s.map(d => ({inline_data:{mime_type:'image/jpeg', data:d}}))];
  const j = await gemini({contents:[{parts}], generationConfig:{responseMimeType:'application/json', temperature:0}});
  const t = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  try { let d = JSON.parse(t.replace(/^\s*```(?:json)?/i, '').replace(/```\s*$/, '')); if (Array.isArray(d)) d = d[0] || {}; return d && typeof d === 'object' ? d : {}; }
  catch(e) { throw new Error('Cevap okunamadı (fiş çok uzun veya bulanık olabilir)'); }
}
function parseJ(j){
  const t = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  try { let d = JSON.parse(t.replace(/^\s*```(?:json)?/i, '').replace(/```\s*$/, '')); if (Array.isArray(d)) d = d[0] || {}; return d && typeof d === 'object' ? d : {}; }
  catch(e) { throw new Error('Yapay zekanın cevabı anlaşılamadı, biraz değiştirip tekrar dene'); }
}
const dsum = d => (Array.isArray(d.items) ? d.items : []).map(normItem).reduce((s, i) => s + (i.line_total || 0), 0);
/* Ürün toplamı fiş toplamına uymuyorsa fişi bir kez daha, farkı söyleyerek okutur. Daha iyi çıkarsa onu kullanır. */
async function analyzeChecked(b64s){
  const data = await analyze(b64s); const t = num(data.total);
  if (!t || Math.abs(dsum(data) - t) <= 0.5) return {data, recheck:''};
  const s1 = dsum(data), d1 = Math.abs(s1 - t);
  try {
    const prev = JSON.stringify({total:data.total, items:(data.items || []).map(i => ({raw:i.raw, name:i.name, qty:i.qty, line_total:i.line_total}))}).slice(0, 6000);
    const hint = `\n\nİKİNCİ KONTROL: Önceki okumanda ürün satırlarının toplamı ${s1.toFixed(2)} TL, fiş toplamı ${t.toFixed(2)} TL çıktı; fark ${(t - s1).toFixed(2)} TL. Önceki okuma (hatalı olabilir): ${prev}\nFişi baştan, satır satır dikkatle oku. Atladığın satırı (ücretli poşet dahil) ekle, yanlış okuduğun tutarı düzelt. Fişte olmayan satır uydurma. Aynı JSON formatında TAM sonucu döndür.`;
    onProg && onProg({t:'second'});
    const d2 = await analyze(b64s, hint); const t2 = num(d2.total) || t;
    if (Math.abs(t2 - t) <= 0.5 && Math.abs(dsum(d2) - t) < d1) return {data:d2, recheck:Math.abs(dsum(d2) - t) <= 0.5 ? 'fixed' : 'better'};
    return {data, recheck:'same'};
  } catch(e) { if (e.cancel) throw e; return {data, recheck:''}; }
}
function normItem(i){
  const qty = num(i.qty) || 1; let lt = num(i.line_total); let up = num(i.unit_price); const discount = Math.abs(num(i.discount));
  if (!lt && up) lt = +(up*qty).toFixed(2);
  if (lt && (!up || discount)) up = +(lt/qty).toFixed(2);
  const raw = String(i.raw || '').trim(); const kn = raw ? nameMap()[key(raw)] : null;
  let generic = kn ? kn.generic : String(i.generic || i.name || '').toLocaleLowerCase('tr').trim();
  const gm = genMap()[generic]; if (gm) generic = gm;
  const learned = kn ? kn.category : catMap()[generic];

          brand:kn ? kn.brand : String(i.brand || ''), generic, qty, unit:i.unit || 'adet',
          unit_price:up, discount, line_total:lt, category:learned && CATS.includes(learned) ? learned : (CATS.includes(i.category) ? i.category : 'Diğer')};

const fmtQty = by => Object.entries(by).map(([u, n]) => n.toLocaleString('tr-TR', {maximumFractionDigits:2}) + ' ' + u).join(' · ') || '0';
function priceStat(ps, m){
  const by = {}; ps.forEach(x => (by[x.u] = by[x.u] || []).push(x));
  return Object.entries(by).map(([u, a]) => { let v, ex = ''; const at = x => `${esc(x.s)} · ${shortDate(x.d)}`;
    if (m === 'avg_unit_price') v = a.reduce((s, x) => s + x.p, 0) / a.length;
    else if (m === 'min_unit_price') { const x = a.reduce((b, c) => c.p < b.p ? c : b); v = x.p; ex = at(x); }
    else if (m === 'max_unit_price') { const x = a.reduce((b, c) => c.p > b.p ? c : b); v = x.p; ex = at(x); }
    else { const x = [...a].sort((p, q) => q.d.localeCompare(p.d))[0]; v = x.p; ex = at(x); }
    return {u, v, ex}; });
}
function runQuery(all, sp){

  const pq = key(sp.product), from = validDate(sp.from), to = validDate(sp.to), cat = CATS.includes(sp.category) ? sp.category : '', st = sp.store ? key(normStore(sp.store)) : '';
  const lines = [];
  for (const r of all) { if (from && r.date < from) continue; if (to && r.date > to) continue; if (st && key(normStore(r.store)) !== st) continue;
    for (const it of r.items) { if (cat && it.category !== cat) continue;
      if (pq && ![it.generic, it.name, it.brand].some(x => key(x).includes(pq))) continue;
      lines.push({r, it}); } }
  const B = {};
  for (const {r, it} of lines) { const k = g === 'month' ? r.date.slice(0, 7) : g === 'store' ? normStore(r.store) : g === 'category' ? it.category : g === 'product' ? key(it.generic || it.name) : 'Toplam';
    const o = B[k] = B[k] || {spent:0, qty:{}, rc:new Set(), ps:[], n:0}; o.n++; o.spent += it.line_total || 0; const u = uk(it.unit); o.qty[u] = (o.qty[u] || 0) + (it.qty || 0);
    o.rc.add(r.id); if (it.unit_price) o.ps.push({p:it.unit_price, d:r.date, s:r.store, u}); }
  let rows = Object.entries(B).map(([label, o]) => {
    if (m === 'spent') return {label, value:TRY(o.spent), sort:o.spent, n:o.n};
    if (m === 'quantity') return {label, value:fmtQty(o.qty), sort:Object.values(o.qty).reduce((a, b) => a + b, 0), n:o.n};

    const st2 = priceStat(o.ps, m); return {label, value:st2.map(x => `${TRY(x.v)}/${x.u}`).join(' · ') || '—', sub:st2.map(x => x.ex).filter(Boolean).join(' · '), sort:st2[0] ? st2[0].v : 0, n:o.n}; });
  if (g === 'month') rows.sort((a, b) => a.label.localeCompare(b.label)); else rows.sort((a, b) => (m === 'min_unit_price' ? a.sort - b.sort : b.sort - a.sort));

  if (g === 'month') rows.forEach(r => r.label = monthName(r.label));
  if (g === 'category') rows.forEach(r => r.label = r.label);
  return {rows, lines, m, g};
}

  const prompt = `Aşağıda market fişlerinden toplanmış "genel ürün adları" var. Aynı ürünü anlatan ve yalnızca yazım, kısaltma veya marka farkı olan adları grupla. Paket boyutu veya ürün çeşidi farklıysa (süt 1 lt ile süt 200 ml; beyaz peynir ile kaşar peyniri; domates ile salkım domates) ASLA birleştirme. Emin olmadığın grubu yazma. Her grup için en okunaklı kısa ortak adı "canonical" olarak seç (küçük harf). SADECE JSON döndür: {"groups":[{"canonical":"süt 1 lt","members":["süt 1lt","pınar süt 1 lt"]}]}\nAdlar:\n${list.join('\n')}`;
  const d = parseJ(await gemini({contents:[{parts:[{text:prompt}]}], generationConfig:{responseMimeType:'application/json', temperature:0}}));

function cleanInfo(o){

  const size = Math.max(0, num(o.size)), ok = su && size > 0 && size < 100000;
  return {type:key(o.type).slice(0, 40), brand:String(o.brand || '').trim().slice(0, 40), detail:String(o.detail || '').trim().slice(0, 40),
          size:ok ? size : 0, size_unit:ok ? su : '', pack:ok ? Math.min(100, Math.max(1, Math.round(num(o.pack) || 1))) : 1, src:'ai'};
}
function needEnrich(all){ const pi = pinfoMap(), m = new Map();
  for (const r of all) for (const it of r.items) { const k = ikey(it); if (!pi[k] && !m.has(k) && (it.name || it.generic)) m.set(k, it); }
  return m; }

    const types = [...new Set(all.flatMap(r => r.items.map(it => getInfo(it, pi).type)).filter(Boolean))].slice(0, 80);
    const prompt = `Aşağıda market fişlerinden ürün satırları var. Her biri için ürün cinsini, markasını ve paket boyutunu çıkar. SADECE JSON döndür:

Kurallar:

  for (const r of recs) imgs.push(await imgGet(r.id));
  for (const r of recs) { await DB.del(r.id); await imgDel(r.id); }
  toastAct(recs.length + ' fiş silindi', 'Geri al', async () => { for (let k = 0; k < recs.length; k++) { await DB.put(recs[k]); if (imgs[k]) await DB.put(imgs[k], 'imgs'); } toast('Geri alındı'); show(tab); });
}

const nomerge = () => LS.get('nomerge', {});
function bgr(x){ const t = ' ' + key(x).replace(/[^a-z0-9ğüşıöçâîû ]/g, '') + ' ', a = new Set(); for (let i = 0; i < t.length - 1; i++) a.add(t.slice(i, i + 2)); return a; }
function dice(a, b){ const A = bgr(a), B = bgr(b); if (!A.size || !B.size) return 0; let n = 0; A.forEach(x => B.has(x) && n++); return 2 * n / (A.size + B.size); }
const digs = x => (String(x).match(/\d+/g) || []).join(',');
async function fillMergeHints(){
  const d = draft; if (!d) return; const all = await DB.all(); if (draft !== d) return;
  const known = new Set(); all.forEach(r => r.items.forEach(i => { const g = key(i.generic || i.name); if (g) known.add(g); }));
  const nm = nomerge(), cand = [...known];
  d.items.forEach((it, i) => { const g = key(it.generic || it.name); if (!g || known.has(g)) return;
    const sc = cand.filter(c => digs(c) === digs(g) && !nm[g + '|' + c]).map(c => [c, dice(g, c)]).sort((a, b) => b[1] - a[1]);
    if (!sc.length || sc[0][1] < 0.72 || (sc[1] && sc[0][1] - sc[1][1] < 0.05)) return;
    const box = document.querySelector(`[data-i="${i}"][data-f="name"]`); if (!box) return; const c = sc[0][0];
    box.insertAdjacentHTML('afterend', `<div class="pa" style="font-weight:500">💡 “${esc(g)}” ürünü daha önce aldığın “${esc(c)}” ile aynı mı?<div><button class="btn alt sm" data-act="mgyes" data-i="${i}" data-c="${esc(c)}" style="display:inline-block;width:auto;min-height:36px;margin:6px 6px 0 0">Evet, aynı</button><button class="btn alt sm" data-act="mgno" data-i="${i}" data-c="${esc(c)}" style="display:inline-block;width:auto;min-height:36px;margin:6px 0 0">Hayır</button></div></div>`); });
}

/* API anahtarı: iki yerde saklanır, hep kalıcı depolama istenir, yedeğe de girer */
const kvOpen = () => new Promise((res, rej) => { const q = indexedDB.open('fis-meta', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
async function kvSet(k, v){ try { const db = await kvOpen(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = rej; }); } catch(e) {} }
async function kvGet(k){ try { const db = await kvOpen(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch(e) { return undefined; } }
function saveKey(k, m){ localStorage.setItem('gkey', k); if (m) localStorage.setItem('gmodel', m); kvSet('gkey', k); if (m) kvSet('gmodel', m); }
async function restoreKey(){ try {
  if (!localStorage.getItem('gkey')) { const k = await kvGet('gkey'); if (k) { localStorage.setItem('gkey', k); const m = await kvGet('gmodel'); if (m) localStorage.setItem('gmodel', m); } }
  else kvSet('gkey', localStorage.getItem('gkey'));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {} }

// iPhone standalone: sabit menü kısa sayfalarda yukarıda kalabiliyor; gerçek ekran altına göre düzelt
function fixNav(){
  try{
    if(!navigator.standalone) return;
    if(innerWidth > innerHeight) return;
    const n = document.getElementById('nav'); if(!n || getComputedStyle(n).display==='none') return;
    const root = document.documentElement;
    root.style.setProperty('--d','0px');
    const sh = Math.max(screen.height, screen.width);
    const gap = sh - n.getBoundingClientRect().bottom;
    const want = 16;
    const d = Math.round(gap - want);
    if (Math.abs(d) > 2 && Math.abs(d) < 160) root.style.setProperty('--d', d + 'px');
  }catch(e){}
}
['load','resize','orientationchange','pageshow','focusout'].forEach(ev => addEventListener(ev, () => { fixNav(); setTimeout(fixNav, 250); setTimeout(fixNav, 900); }));
