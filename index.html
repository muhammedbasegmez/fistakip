<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DDE2E6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Fiş Arşivi</title>
<style>
:root{color-scheme:light;
  --desk:#DDE2E6;--paper:#FCFCFA;--ink:#1A2433;--mut:#5C6877;--line:#BAC3CC;--edge:#CBD2D9;--field:#F0F2F4;
  --hl:#FFD84D;--on-hl:#2B2300;--bad:#B42318;--ok:#157347;--warn:#8A5A00;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --desk:#0E1217;--paper:#1A2029;--ink:#E9EDF2;--mut:#9AA6B5;--line:#3A4451;--edge:#262E39;--field:#10151B;
  --hl:#F5CF3E;--on-hl:#2B2300;--bad:#FF8A80;--ok:#6FD39A;--warn:#F2C14E}}
:root[data-theme=dark]{color-scheme:dark;
  --desk:#0E1217;--paper:#1A2029;--ink:#E9EDF2;--mut:#9AA6B5;--line:#3A4451;--edge:#262E39;--field:#10151B;
  --hl:#F5CF3E;--on-hl:#2B2300;--bad:#FF8A80;--ok:#6FD39A;--warn:#F2C14E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:14px 14px 28px}
h2{margin:8px 2px 14px;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.card{position:relative;background:var(--paper);border:1px solid var(--edge);border-radius:6px;padding:14px;margin-bottom:12px}
.card.torn{margin-bottom:22px;border-bottom:0;border-radius:6px 6px 0 0}
.card.torn::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-9px;height:9px;
  background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/14px 14px,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 7px 0/14px 14px;
  filter:drop-shadow(0 1px 0 var(--edge))}
.btn{display:block;width:100%;min-height:48px;text-align:center;background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:12px;font-size:16px;font-weight:700;margin:10px 0;cursor:pointer;font-family:inherit}
.btn.alt{background:transparent;color:var(--ink)}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{display:inline-block;width:auto;min-height:40px;padding:8px 14px;font-size:14px;margin:4px 6px 4px 0}
.btn:disabled{opacity:.45}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,nav button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
input,select{width:100%;min-height:44px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;font-family:inherit}
input:focus,select:focus{border-color:var(--ink)}
input[type=range]{padding:0;border:0;min-height:32px;background:none;accent-color:var(--ink)}
label.f{display:block;color:var(--mut);font-size:13px;margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.mut{color:var(--mut);font-size:14px}
.sub{color:var(--mut);font-size:13px}
.big{font-family:var(--mono);font-size:30px;line-height:1.25;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hl{background:var(--hl);color:var(--on-hl);padding:0 .28em;margin:0 -.28em;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.up{color:var(--bad);font-weight:600}.down{color:var(--ok);font-weight:600}
.err{color:var(--bad)}
.warn{color:var(--warn);font-size:14px;font-weight:600}
.li>b,.pl>b,.card.row>b,.catH>span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pl>span:last-child,.pl>div+b{font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--paper);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;background:none;border:0;color:var(--mut);padding:8px 0 8px;font-size:12px;font-family:inherit;min-height:58px}
nav button span{display:inline-block;font-size:20px;line-height:1;padding:5px 18px;border-radius:14px;margin-bottom:2px}
nav button.on{color:var(--ink);font-weight:700}
nav button.on span{background:var(--hl)}
.item{border-top:1px dashed var(--line);padding:10px 0}
.item .row input{padding:8px 10px;min-height:40px}
.thumb{width:48px;height:64px;object-fit:cover;border-radius:3px;background:#000;flex:none}
.bar{height:6px;background:var(--field);border:1px solid var(--edge);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ink)}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px dashed var(--line);cursor:pointer}
.li:first-of-type{border-top:0}
.catH{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-bottom:5px;border-bottom:1.5px solid var(--ink);font-weight:700}
.pl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.catH+.pl{border-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
summary{cursor:pointer;color:var(--mut)}
dialog{background:var(--paper);color:var(--ink);border:1px solid var(--edge);border-radius:10px;width:min(92vw,520px);max-height:86vh}
dialog::backdrop{background:rgba(8,11,15,.6)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:10px;display:none;z-index:9;max-width:90vw;text-align:center;font-weight:600}
#lock{position:fixed;inset:0;background:var(--desk);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
#lock[hidden]{display:none}
.tbar{fill:var(--ink);opacity:.25}.tbar.on{opacity:1}.tlab{fill:var(--mut)}
.pline{fill:none;stroke:var(--ink);stroke-width:2}.pdot{fill:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav">
  <button data-tab="ekle"><span>📷</span>Ekle</button>
  <button data-tab="fisler"><span>🧾</span>Fişler</button>
  <button data-tab="rapor"><span>📊</span>Rapor</button>
  <button data-tab="ayar"><span>⚙️</span>Ayarlar</button>
</nav>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<div id="lock" hidden>
  <div style="font-size:40px">🔒</div><b>Fiş Arşivi</b>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="max-width:220px;text-align:center;font-size:20px">
  <button class="btn" id="unlock" style="max-width:220px">Aç</button>
  <div id="pinerr" class="err"></div>
</div>

<script>
'use strict';
/* ================= yardımcılar ================= */
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TRY = n => (Number(n) || 0).toLocaleString('tr-TR', {style:'currency', currency:'TRY'});
const num = v => { if (typeof v === 'string') v = parseFloat(v.replace(',', '.')); return Number.isFinite(v) ? v : 0; };
const today = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const validDate = d => /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? d : '';
const dayNum = d => { const [y,m,dd] = d.split('-').map(Number); return Date.UTC(y, m-1, dd) / 864e5; };
const key = s => String(s || '').toLocaleLowerCase('tr').trim();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};
const CATS = ['Meyve-Sebze','Et-Tavuk-Balık','Süt-Kahvaltılık','Fırın','Bakliyat-Makarna','Yağ-Sos-Baharat','İçecek','Atıştırmalık','Tatlı-Çikolata','Temizlik','Kişisel Bakım','Diğer'];
const CAT_ICON = {'Meyve-Sebze':'🥬','Et-Tavuk-Balık':'🍗','Süt-Kahvaltılık':'🥛','Fırın':'🍞','Bakliyat-Makarna':'🍝','Yağ-Sos-Baharat':'🫒','İçecek':'🥤','Atıştırmalık':'🍪','Tatlı-Çikolata':'🍫','Temizlik':'🧽','Kişisel Bakım':'🧴','Diğer':'📦'};
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DAYS = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const monthName = k => { const [y,m] = k.split('-'); return MONTHS[+m-1] + ' ' + y; };
const prevMonth = k => { const [y,m] = k.split('-').map(Number); const d = new Date(y, m-2, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const fmtDate = d => { const [y,m,dd] = d.split('-').map(Number); return dd + ' ' + MONTHS[m-1] + ' ' + y + ', ' + DAYS[new Date(y, m-1, dd).getDay()]; };
const shortDate = d => { const [y,m,dd] = d.split('-').map(Number); return dd + ' ' + MONTHS[m-1].slice(0,3) + ' ' + y; };
function toast(t){ const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 3200); }

/* birim ve ürün anahtarı: kg ile adet fiyatları karışmasın */
const uk = u => { u = key(u); return /^(kg|kilo|kilogram|g|gr|gram)$/.test(u) ? 'kg' : /^(lt|l|litre|ml)$/.test(u) ? 'lt' : 'adet'; };
const pkey = it => key(it.generic || it.name) + '|' + uk(it.unit);
const pname = id => id.split('|')[0];

/* market adı */
const STORES = {'bim':'BİM','bım':'BİM','a101':'A101','şok':'ŞOK','sok':'ŞOK','migros':'Migros','carrefoursa':'CarrefourSA','carrefour':'CarrefourSA'};
const knownStores = () => LS.get('stores', []);
function learnStore(s){ if (!s) return; const a = knownStores(); if (a.some(k => key(k) === key(s))) return; a.push(s); LS.set('stores', a); }
function normStore(s){ s = String(s || '').trim(); const l = key(s);
  for (const k in STORES) if (new RegExp('(^|[^a-z0-9çğıöşü])' + k + '([^a-z0-9çğıöşü]|$)').test(l)) return STORES[k];
  return knownStores().find(k => key(k) === l) || s; }
function dateWarn(d){
  if (!validDate(d)) return 'Tarih okunamadı, lütfen gir.';
  if (d > today()) return 'Tarih bugünden ileride, kontrol et.';
  if (d < new Date(Date.now() - 400*864e5).toISOString().slice(0,10)) return 'Tarih bir yıldan eski görünüyor, kontrol et.';
  return ''; }

/* öğrenme hafızası */
const catMap = () => LS.get('catmap', {});
const nameMap = () => LS.get('namemap', {});
function learnCats(items){ const m = catMap(); items.forEach(i => { const k = key(i.generic || i.name); if (k && i.category) m[k] = i.category; }); LS.set('catmap', m); }
function learnNames(items){ const m = nameMap();
  items.forEach(i => { if (i.raw) m[key(i.raw)] = {name:i.name, brand:i.brand || '', generic:i.generic, category:i.category}; }); LS.set('namemap', m); }

/* ================= IndexedDB ================= */
const DB = {
  db:null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('fis-arsivi', 2);
    r.onupgradeneeded = () => { const d = r.result;
      if (!d.objectStoreNames.contains('receipts')) d.createObjectStore('receipts', {keyPath:'id'});
      if (!d.objectStoreNames.contains('queue')) d.createObjectStore('queue', {keyPath:'id'}); };
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  req(q){ return new Promise((res, rej) => { q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  st(n, mode){ return this.db.transaction(n, mode).objectStore(n); },
  all(n = 'receipts'){ return this.req(this.st(n, 'readonly').getAll()); },
  put(o, n = 'receipts'){ return this.req(this.st(n, 'readwrite').put(o)); },
  del(id, n = 'receipts'){ return this.req(this.st(n, 'readwrite').delete(id)); },
  clear(n = 'receipts'){ return this.req(this.st(n, 'readwrite').clear()); }
};

/* ================= Gemini ================= */
const examples = () => {
  const arr = Object.entries(nameMap()).slice(-40); if (!arr.length) return '';
  return '\nKullanıcının daha önce doğruladığı eşleştirmeler (fişteki yazım → ad | genel ad | kategori). Aynı veya benzer yazım görürsen bunlara uy:\n'
    + arr.map(([k, v]) => `${k.slice(0, 60)} → ${String(v.name).slice(0, 60)} | ${String(v.generic).slice(0, 40)} | ${v.category}`).join('\n'); };
function buildPrompt(n){
  return `Bu bir Türkiye market fişi fotoğrafı${n > 1 ? ` (${n} fotoğraf, aynı fişin parçaları, yukarıdan aşağıya sırayla; tek fiş olarak oku, üst üste binen satırları iki kez sayma)` : ''}. Fişi oku ve SADECE aşağıdaki JSON'u döndür:
{"store":"market adı","branch":"","date":"YYYY-MM-DD","time":"HH:MM","payment":"","total":0,"discount_total":0,"items":[{"raw":"fişte yazdığı gibi, aynen","name":"fişteki ürün adı (okunaklı hale getir)","uncertain":false,"brand":"","generic":"markasız genel ürün adı, küçük harf, paket boyutuyla, örn: süt 1 lt, domates, ekmek, deterjan 4 kg","qty":1,"unit":"adet|kg|lt","unit_price":0,"discount":0,"line_total":0,"category":"..."}]}
Kurallar:
- Tutarlar TL, ondalık ayırıcı nokta olan sayı olsun.
- Kiloyla satılan ürünlerde qty kg cinsinden, unit_price kg fiyatı olsun.
- İndirim/kampanya satırı varsa ilgili ürünün line_total değerine yansıt; ayrı ürün olarak ekleme.
- Poşet, KDV, toplam, ara toplam, kart/nakit satırlarını ürün olarak ekleme.
- category şunlardan biri olsun: ${CATS.join(', ')}.
- Tarih: Türk fişlerinde GG.AA.YYYY veya GG/AA/YYYY yazar (gün önce gelir). Fişin basıldığı tarihi YYYY-MM-DD yap; son kullanma tarihi, kampanya tarihi veya fiş/işlem numarasıyla karıştırma. Saat varsa time alanına HH:MM yaz.
- Market adı: fiş başlığındaki market adını yaz. Zincir olabilir (BİM, A101, ŞOK, Migros, CarrefourSA) ya da yerel market olabilir (Tezgel Market gibi); yerelse başlıktaki adı düzgün yazımla, olduğu gibi ver. Şube/adres varsa kısaca branch alanına yaz.
- raw: ürünün fişte yazdığı ham metin, kısaltmalar dahil aynen. name: bu metni okunaklı ürün adına çevir, kısaltmaları aç. Çözerken ürünün fiyatına, birimine ve fişteki diğer ürünlere bak, Türkiye market ürünlerini düşün. İnternette arama yapamazsın. Çözemezsen en olası tahmini name'e yaz ve uncertain'ı true yap; marka veya ürün uydurma.
- generic: fiyat karşılaştırması için paket boyutunu da ekle (süt 1 lt, yumurta 15'li gibi); boyut fişte yoksa ekleme.
- brand: ürün adında marka varsa yaz (Pınar, Ülker, Eti gibi), yoksa boş bırak.
- discount: o ürüne uygulanan indirim tutarı (pozitif sayı), yoksa 0. line_total indirim düşülmüş net tutardır. discount_total: fişteki toplam indirim.
- payment: nakit veya kart, görünmüyorsa boş bırak.
- Kategori için ürünün ne olduğuna bak: sebze, meyve → Meyve-Sebze; et, tavuk, balık, sucuk, salam → Et-Tavuk-Balık; yumurta, süt, peynir, yoğurt, zeytin, tereyağı → Süt-Kahvaltılık; ekmek, simit, poğaça → Fırın; makarna, pirinç, bulgur, mercimek, un, şeker → Bakliyat-Makarna; yağ, salça, ketçap, baharat, tuz, konserve → Yağ-Sos-Baharat; su, çay, kahve, meşrubat, meyve suyu → İçecek; cips, bisküvi, kuruyemiş → Atıştırmalık; çikolata, dondurma, tatlı → Tatlı-Çikolata; deterjan, çamaşır suyu, kâğıt havlu, tuvalet kâğıdı → Temizlik; şampuan, diş macunu, sabun → Kişisel Bakım.
- Okuyamadığın alanı boş bırak veya 0 yaz, tahmin uydurma.${examples()}`;
}
/* Ağ hatalarında ve kota/sunucu hatalarında kendiliğinden yeniden dener; model adı bulunamazsa yedek modele geçer */
async function gemini(body){
  const k = localStorage.getItem('gkey'); if (!k) { const e = new Error('API anahtarı girilmemiş'); e.fatal = true; throw e; }
  const first = (localStorage.getItem('gmodel') || 'gemini-flash-latest').trim();
  const models = [...new Set([first, 'gemini-flash-latest', 'gemini-flash-lite-latest'])];
  let lastErr = null;
  for (const m of models) {
    for (let a = 0; a < 3; a++) {
      let r;
      try { r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,
        {method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':k}, body:JSON.stringify(body)}); }
      catch(e) { lastErr = new Error('Google\'a ulaşılamadı (internet?)'); await sleep(a ? 6000 : 2500); continue; }
      if (r.ok) return r.json();
      let msg = ''; try { msg = (await r.json()).error.message; } catch(e) {}
      if (r.status === 404) { lastErr = new Error('Model bulunamadı: ' + m); break; }
      if (r.status === 429 || r.status >= 500) { lastErr = new Error(r.status === 429 ? 'Ücretsiz kota veya dakikalık sınır doldu' : 'Google geçici hata verdi (' + r.status + ')'); await sleep(a ? 9000 : 3000); continue; }
      const e = new Error('Gemini ' + r.status + ': ' + msg); e.fatal = true; throw e;
    }
  }
  throw lastErr || new Error('Bilinmeyen hata');
}
async function analyze(b64s){
  const parts = [{text:buildPrompt(b64s.length)}, ...b64s.map(d => ({inline_data:{mime_type:'image/jpeg', data:d}}))];
  const j = await gemini({contents:[{parts}], generationConfig:{responseMimeType:'application/json', temperature:0}});
  const t = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  try { let d = JSON.parse(t.replace(/^\s*```(?:json)?/i, '').replace(/```\s*$/, '')); if (Array.isArray(d)) d = d[0] || {}; return d && typeof d === 'object' ? d : {}; }
  catch(e) { throw new Error('Cevap okunamadı (fiş çok uzun veya bulanık olabilir)'); }
}
function normItem(i){
  const qty = num(i.qty) || 1; let lt = num(i.line_total); let up = num(i.unit_price); const discount = Math.abs(num(i.discount));
  if (!lt && up) lt = +(up*qty).toFixed(2);
  if (lt && (!up || discount)) up = +(lt/qty).toFixed(2);
  const raw = String(i.raw || '').trim(); const kn = raw ? nameMap()[key(raw)] : null;
  const generic = kn ? kn.generic : String(i.generic || i.name || '').toLocaleLowerCase('tr').trim();
  const learned = kn ? kn.category : catMap()[generic];
  return {raw, uncertain:!kn && (i.uncertain === true || i.uncertain === 'true'), name:kn ? kn.name : String(i.name || ''),
          brand:kn ? kn.brand : String(i.brand || ''), generic, qty, unit:i.unit || 'adet',
          unit_price:up, discount, line_total:lt, category:learned && CATS.includes(learned) ? learned : (CATS.includes(i.category) ? i.category : 'Diğer')};
}
const fp = i => key(i.name) + '|' + i.qty + '|' + i.line_total + '|' + i.category;
function makeDraft(data, thumb){
  const items = (Array.isArray(data.items) ? data.items : []).map(normItem);
  const d = {id:crypto.randomUUID(), thumb, store:normStore(data.store), branch:String(data.branch || ''), date:validDate(data.date),
             time:String(data.time || ''), payment:String(data.payment || ''), total:num(data.total),
             discount_total:num(data.discount_total) || items.reduce((s, i) => s + (i.discount || 0), 0), items, isNew:true};
  d.ai = {store:key(d.store), date:d.date, total:d.total, items:items.map(fp)};
  return d;
}
function calcAcc(d){ const a = d.ai; if (!a) return null;
  const pool = [...a.items]; let ok = 0;
  d.items.map(fp).forEach(f => { const i = pool.indexOf(f); if (i >= 0) { pool.splice(i, 1); ok++; } });
  return {n:Math.max(a.items.length, d.items.length), ok, head:(a.store === key(normStore(d.store)) ? 1 : 0) + (a.date === d.date ? 1 : 0) + (a.total === d.total ? 1 : 0)};
}

/* ================= görsel ================= */
function loadSrc(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Fotoğraf açılamadı')); i.src = src; }); }
function loadImg(file){ const u = URL.createObjectURL(file); return loadSrc(u).finally(() => URL.revokeObjectURL(u)); }
function toJpeg(img, max, q){ const s = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement('canvas');
  c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q); }

const pinHash = () => localStorage.getItem('pin');
async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function setPin(p){ const salt = crypto.randomUUID(); localStorage.setItem('pin', salt + ':' + await sha(salt + p)); }
async function checkPin(p){ const v = pinHash(); if (!v) return true; const [salt, h] = v.split(':'); return (await sha(salt + p)) === h; }
let pinTries = 0, hiddenAt = 0;
function lock(){ if (!pinHash()) return; $('#lock').hidden = false; $('#pin').value = ''; try { $('#pin').focus(); } catch(e) {} }
async function tryUnlock(){
  if (await checkPin($('#pin').value)) { pinTries = 0; $('#pinerr').textContent = ''; $('#lock').hidden = true; }
  else { pinTries++; $('#pinerr').textContent = 'Yanlış PIN'; $('#pin').value = ''; const b = $('#unlock'); b.disabled = true; setTimeout(() => b.disabled = false, Math.min(pinTries, 5) * 1000); }
}
$('#unlock').onclick = tryUnlock; $('#pin').onkeydown = e => { if (e.key === 'Enter') tryUnlock(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = Date.now(); else if (hiddenAt && pinHash() && Date.now() - hiddenAt > 60000) lock(); });

/* ================= RAPOR ================= */
function unitPrices(rs){ const m = new Map();
  for (const r of rs) for (const it of r.items) { const k = pkey(it); if (!pname(k)) continue;
    let a = m.get(k); if (!a) { a = {id:k, name:it.generic || it.name, unit:uk(it.unit), count:0, qty:0, spent:0, ps:[]}; m.set(k, a); }
    a.count++; a.qty += it.qty || 0; a.spent += it.line_total || 0; if (it.unit_price) a.ps.push(it.unit_price); }
  for (const a of m.values()) a.avg = a.ps.length ? a.ps.reduce((s, x) => s + x, 0) / a.ps.length : 0;
  return m; }
function hist(it, r, all){
  const k = pkey(it); if (!pname(k) || !it.unit_price) return null;
  const pts = [];
  for (const x of all) { if (x.id === r.id) continue;
    for (const y of x.items) if (pkey(y) === k && y.unit_price) pts.push({d:x.date, p:y.unit_price, s:x.store}); }
  if (!pts.length) return null;
  const prev = pts.filter(p => p.d <= r.date).sort((a, b) => b.d.localeCompare(a.d))[0] || null;
  const best = pts.reduce((a, b) => b.p < a.p ? b : a);
  return {prev, best};
}
/* kişisel enflasyon: ardışık aylarda ortak ürünlerin ağırlıklı fiyat değişimi */
function inflation(all){
  const mm = {};
  for (const r of all) { const mk = r.date.slice(0, 7); const o = mm[mk] = mm[mk] || {};
    for (const it of r.items) { if (!(it.line_total > 0) || !(it.qty > 0) || !pname(pkey(it))) continue;
      const k = pkey(it); const a = o[k] = o[k] || {spent:0, qty:0, name:it.generic || it.name}; a.spent += it.line_total; a.qty += it.qty; } }
  const out = [];
  for (const mk of Object.keys(mm).sort()) { const pm = prevMonth(mk); if (!mm[pm]) continue;
    let wsum = 0, acc = 0, n = 0; const movers = [];
    for (const [k, cur] of Object.entries(mm[mk])) { const pv = mm[pm][k]; if (!pv) continue;
      const p1 = cur.spent / cur.qty, p0 = pv.spent / pv.qty; if (!(p0 > 0)) continue;
      const ratio = p1 / p0; if (ratio > 3 || ratio < 1/3) continue;
      wsum += pv.spent; acc += pv.spent * ratio; n++; movers.push({name:cur.name, p0, p1, c:(ratio - 1) * 100}); }
    if (n >= 3 && wsum > 0) out.push({mk, change:(acc / wsum - 1) * 100, n, movers}); }
  return out;
}
function inflCard(infl){
  if (!infl.length) return `<div class="card"><b>Kişisel enflasyon</b><div class="mut">Hesap için ardışık iki ayda en az 3 ortak ürün gerekir. Fiş eklemeye devam et.</div></div>`;
  const cur = infl.find(x => x.mk === repMonth);
  let run = 1, cnt = 0; for (let i = infl.length - 1; i >= 0; i--) { if (i < infl.length - 1 && prevMonth(infl[i + 1].mk) !== infl[i].mk) break; run *= 1 + infl[i].change / 100; cnt++; }
  const last = infl.slice(-6).reverse();
  return `<div class="card"><b>Kişisel enflasyon</b> <span class="sub">(sık aldığın ürünlerin fiyatı)</span>
    ${cur ? `<div class="big" style="margin-top:6px">${arrow(cur.change)}</div><div class="mut">${monthName(repMonth)}: bir önceki aya göre ${cur.change >= 0 ? '+' : ''}${cur.change.toFixed(1)}% · ${cur.n} ortak ürün</div>
      ${cur.movers.length ? `<div class="mut" style="margin-top:8px">En çok değişenler</div>${[...cur.movers].sort((a, b) => Math.abs(b.c) - Math.abs(a.c)).slice(0, 3).map(m => `<div class="pl"><span>${esc(pname(m.name))}</span><span>${TRY(m.p0)} → ${TRY(m.p1)} ${arrow(m.c)}</span></div>`).join('')}` : ''}`

function dueSoon(all){
  const m = {};
  for (const r of all) for (const it of r.items) { const k = pkey(it); if (!pname(k)) continue; const o = m[k] = m[k] || {name:it.generic || it.name, ds:new Set()}; o.ds.add(r.date); }
  const t = dayNum(today()); const out = [];
  for (const o of Object.values(m)) { const ds = [...o.ds].sort(); if (ds.length < 3) continue;
    const iv = []; for (let i = 1; i < ds.length; i++) iv.push(dayNum(ds[i]) - dayNum(ds[i - 1]));
    iv.sort((a, b) => a - b); const med = iv[Math.floor(iv.length / 2)]; if (med < 3) continue;
    const since = t - dayNum(ds[ds.length - 1]); const ratio = since / med;
    if (ratio >= 0.8) out.push({name:o.name, since, med, ratio}); }
  return out.sort((a, b) => b.ratio - a.ratio).slice(0, 8);
}

  else if (t.id === 'themesel') { localStorage.setItem('theme', t.value); applyTheme(); }
  else { onInput(e); if (t.dataset.f === 'category' && draft) { const y = scrollY; renderReview(); scrollTo(0, y); } } });
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) { if (b.dataset.tab === 'ekle' && tab === 'ekle') { draft = null; photos = []; } detailId = null; show(b.dataset.tab); } };
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  const a = el.dataset.act;
  if (a === 'manual') { draft = {id:crypto.randomUUID(), thumb:'', store:'', date:today(), items:[], total:0, isNew:true}; renderAdd(); }
  else if (a === 'addrow') { draft.items.push(normItem({name:'', qty:1})); renderReview(); }
  else if (a === 'rm') { draft.items.splice(+el.dataset.i, 1); renderReview(); }
  else if (a === 'cancel') { const was = draft; draft = null; if (was && !was.isNew) { detailId = was.id; show(detailFrom); } else { detailId = null; show('fisler'); } }
  else if (a === 'save') {
    if (!validDate(draft.date)) { toast('Tarih gerekli'); return; }
    draft.store = normStore(draft.store);
    draft.items = draft.items.filter(i => i.name || i.line_total);
    const acc = calcAcc(draft);
    if (!draft.total) draft.total = +itemsSum(draft).toFixed(2);
    const wasNew = draft.isNew;
    if (wasNew) { const dup = await findDup(draft); if (dup && !confirm('Aynı market, gün ve tutarda başka bir fiş var. Yine de kaydedilsin mi?')) return; }
    const r = {...draft}; delete r.isNew; delete r.ai; delete r.dupOf; const fq = r.fromQueue; delete r.fromQueue;
    if (acc) r.acc = acc; if (!r.created) r.created = Date.now();
    await DB.put(r); if (fq) await DB.del(fq, 'queue');
    learnCats(r.items); learnNames(r.items); learnStore(r.store);
    const msg = await budgetAlert(r);
    draft = null; detailId = r.id; if (wasNew) detailFrom = 'fisler';
    toast('Kaydedildi' + (msg ? ' — ' + msg : '')); show(detailFrom); }
  else if (a === 'delete') { if (confirm('Bu fiş silinsin mi?')) { await DB.del(draft.id); draft = null; detailId = null; show(detailFrom); } }
  else if (a === 'view') { detailId = el.dataset.id; detailFrom = tab; show(tab); }
  else if (a === 'back') { detailId = null; show(tab); }
  else if (a === 'all') { show('fisler'); }
  else if (a === 'edit') { const r = (await DB.all()).find(x => x.id === detailId); if (!r) return; draft = JSON.parse(JSON.stringify(r)); show('ekle'); }
  else if (a === 'delview') { if (confirm('Bu fiş silinsin mi?')) { await DB.del(detailId); detailId = null; show(tab); } }
  else if (a === 'prod') productDetail(el.dataset.k);
  else if (a === 'close') $('#dlg').close();
  else if (a === 'setmonth') { const m = el.dataset.m; if ((await DB.all()).some(r => r.date.startsWith(m))) { repMonth = m; renderReport(); } else toast('Bu ayda fiş yok'); }
  else if (a === 'read') doRead();
  else if (a === 'crop') openCrop(+el.dataset.i);
  else if (a === 'rmphoto') { photos.splice(+el.dataset.i, 1); renderAdd(); }
  else if (a === 'cancelphotos') { photos = []; renderAdd(); }
  else if (a === 'qread') readQueue(el.dataset.id);
  else if (a === 'qmanual') { const q = (await DB.all('queue')).find(x => x.id === el.dataset.id); if (!q) return;
    draft = {id:crypto.randomUUID(), thumb:q.thumb, store:'', date:today(), items:[], total:0, isNew:true, fromQueue:q.id}; renderAdd(); }
  else if (a === 'qdel') { if (confirm('Bekleyen fotoğraf silinsin mi?')) { await DB.del(el.dataset.id, 'queue'); fillQueue(); } }
  else if (a === 'savekey') { localStorage.setItem('gkey', $('#gkey').value.trim()); localStorage.setItem('gmodel', $('#gmodel').value.trim() || 'gemini-flash-latest'); toast('Kaydedildi'); }
  else if (a === 'savebudget') { const cats = {}; document.querySelectorAll('[data-bc]').forEach(i => { const v = num(i.value); if (v > 0) cats[i.dataset.bc] = v; });
    LS.set('budget', {total:num($('#bt').value), cats}); toast('Bütçe kaydedildi'); }
  else if (a === 'exportjson') { download('fis-yedek-' + today() + '.json', JSON.stringify({v:2, exported:new Date().toISOString(), receipts:await DB.all(), catmap:catMap(), namemap:nameMap(), stores:knownStores(), budget:LS.get('budget', null)}), 'application/json');
    localStorage.setItem('lastBackup', today()); toast('Yedek indirildi'); if (tab === 'ayar') renderSettings(); }
  else if (a === 'exportcsv') { const rows = [['tarih','market','urun','marka','genel_ad','kategori','adet','birim','birim_fiyat','indirim','tutar']];
    (await DB.all()).sort((x, y) => x.date.localeCompare(y.date)).forEach(r => r.items.forEach(i => rows.push([r.date, r.store, i.name, i.brand, i.generic, i.category, i.qty, i.unit, i.unit_price, i.discount, i.line_total])));
    download('fisler-' + today() + '.csv', '﻿' + rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(';')).join('\n'), 'text/csv'); }
  else if (a === 'persist') { const ok = await navigator.storage?.persist?.(); toast(ok ? 'Kalıcı depolama açıldı' : 'Tarayıcı izin vermedi; uygulamayı ana ekrana ekleyip tekrar dene'); renderSettings(); }
  else if (a === 'wipe') { if (confirm('TÜM fişler silinecek. Emin misin?')) { await DB.clear(); toast('Silindi'); renderSettings(); } }
  else if (a === 'wipemem') { if (confirm('Öğrenilen kategori ve ürün adı eşleştirmeleri silinsin mi? Fişlerin silinmez.')) { localStorage.removeItem('catmap'); localStorage.removeItem('namemap'); toast('Sıfırlandı'); } }
  else if (a === 'setpin') { const p = $('#pin1').value.trim(); if (!/^\d{4,8}$/.test(p)) return toast('PIN 4-8 rakam olmalı');
    if (!(crypto.subtle)) return toast('PIN için https gerekir');
    if (!confirm('PIN\'i unutursan uygulamaya giremezsin; tek çıkış site verisini silmektir ve fişlerin gider. Önce yedek aldığından emin ol. Devam edilsin mi?')) return;
    await setPin(p); toast('PIN kilidi açıldı'); renderSettings(); }
  else if (a === 'rmpin') { if (await checkPin($('#pin1').value)) { localStorage.removeItem('pin'); toast('PIN kaldırıldı'); renderSettings(); } else toast('PIN yanlış'); }
});

/* ================= başlat ================= */
lock();
DB.open().then(() => show('ekle')).catch(() => { view.innerHTML = '<div class="card err">Veritabanı açılamadı. Gizli sekmede olabilirsin; normal sekmede aç.</div>'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
