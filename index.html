<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Fiş Arşivi</title>
<style>
:root{color-scheme:light;
  --bg:#F2F4F8;--card:#FFFFFF;--ink:#0F172A;--mut:#64748B;--line:#E6EAF0;--field:#F1F4F9;
  --brand:#0E9F6E;--brand-ink:#0B7A55;--on-brand:#FFFFFF;--brand-soft:rgba(14,159,110,.12);
  --bad:#DC2626;--ok:#15803D;--warn:#B45309;--cardborder:transparent;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 12px 28px -16px rgba(15,23,42,.22);--r:20px;
  --paper:var(--card);--edge:var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --bg:#0B0F14;--card:#141A22;--ink:#E8EEF5;--mut:#8EA0B4;--line:#243040;--field:#0E141B;
  --brand:#34D399;--brand-ink:#34D399;--on-brand:#04201A;--brand-soft:rgba(52,211,153,.14);
  --bad:#FF8A80;--ok:#6FD39A;--warn:#F2C14E;--cardborder:#1E2836;--shadow:none}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#0B0F14;--card:#141A22;--ink:#E8EEF5;--mut:#8EA0B4;--line:#243040;--field:#0E141B;
  --brand:#34D399;--brand-ink:#34D399;--on-brand:#04201A;--brand-soft:rgba(52,211,153,.14);
  --bad:#FF8A80;--ok:#6FD39A;--warn:#F2C14E;--cardborder:#1E2836;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;padding-bottom:112px;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:18px 16px 28px}
h2{margin:6px 2px 16px;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
.card{position:relative;background:var(--card);border:1px solid var(--cardborder);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.torn{margin-bottom:26px;border-radius:var(--r) var(--r) 0 0;border-bottom:0;box-shadow:none;filter:drop-shadow(0 8px 12px rgba(15,23,42,.10))}
:root[data-theme=dark] .card.torn{filter:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .card.torn{filter:none}}
.card.torn::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-9px;height:9px;
  background:linear-gradient(135deg,var(--card) 50%,transparent 50%) 0 0/14px 14px,linear-gradient(225deg,var(--card) 50%,transparent 50%) 7px 0/14px 14px}
.hero{background:linear-gradient(135deg,#0F172A 0%,#115E59 100%);color:#fff;border-color:transparent;
  --brand:#5EEAD4;--bad:#FCA5A5;--ok:#86EFAC;--warn:#FCD34D}
.hero .mut,.hero .sub{color:rgba(255,255,255,.74)}
.hero .big{color:#fff;font-size:38px}
.hero .bar{background:rgba(255,255,255,.18);border-color:transparent}
.btn{display:block;width:100%;min-height:52px;text-align:center;background:var(--brand);color:var(--on-brand);border:0;border-radius:16px;padding:13px 16px;font-size:16px;font-weight:700;margin:10px 0;cursor:pointer;font-family:inherit;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.alt{background:var(--field);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.bad{background:var(--field);color:var(--bad)}
.btn.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);box-shadow:none}
.btn.sm{display:inline-block;width:auto;min-height:42px;padding:9px 16px;font-size:14px;margin:4px 6px 4px 0;border-radius:12px}
.btn:disabled{opacity:.45}
.btn:focus-visible,summary:focus-visible,nav button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input,select{width:100%;min-height:48px;background:var(--field);color:var(--ink);border:1.5px solid transparent;border-radius:14px;padding:11px 14px;font-size:16px;font-family:inherit}
input:focus,select:focus{outline:0;border-color:var(--brand);background:var(--card)}
input[type=range]{padding:0;border:0;min-height:32px;background:none;accent-color:var(--brand)}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--brand);flex:none}
label.f{display:block;color:var(--mut);font-size:13px;font-weight:600;margin:12px 0 5px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.mut{color:var(--mut);font-size:14px}
.sub{color:var(--mut);font-size:13px}
.big{font-size:34px;line-height:1.15;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.up{color:var(--bad);font-weight:700}.down{color:var(--ok);font-weight:700}
.err{color:var(--bad)}
.warn{color:var(--warn);font-size:14px;font-weight:600}
.li>b,.pl>b,.card.row>b,.catH>span:last-child{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pl>span:last-child{font-variant-numeric:tabular-nums}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(calc(100% - 24px),520px);display:flex;gap:4px;padding:6px;
  background:var(--card);background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);
  border-radius:26px;box-shadow:0 14px 34px -12px rgba(15,23,42,.34),0 0 0 1px var(--line);z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;color:var(--mut);padding:7px 0 6px;font-size:11.5px;font-weight:600;font-family:inherit;min-height:56px;border-radius:20px;transition:background .15s,color .15s}
nav button span{font-size:21px;line-height:1.1}
nav button.fab{flex:0 0 62px;width:62px;height:62px;min-height:62px;margin:-26px 6px 0;padding:0;border-radius:50%;background:linear-gradient(145deg,#34D399,#0E9F6E);color:#fff;box-shadow:0 10px 22px -6px rgba(14,159,110,.65),0 0 0 4px var(--card);justify-content:center}
nav button.fab span{font-size:28px}nav button.fab:active{transform:scale(.94)}
#sheetBg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheetBg .sheet{width:min(100%,520px);background:var(--card);border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:shUp .22s ease-out}
@keyframes shUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:18px}
.sheet .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;border-radius:20px;background:var(--brand-soft);color:var(--brand-ink);font-weight:700;font-size:15px;text-align:center;cursor:pointer;border:0;font-family:inherit}
.sheet .tile span{font-size:34px}.sheet .tile small{font-weight:500;font-size:12px;opacity:.8}
.sheet .opt{display:flex;align-items:center;gap:10px;width:100%;padding:13px 4px;background:none;border:0;border-top:1px solid var(--line);color:var(--fg,inherit);font-size:15px;font-family:inherit;text-align:left;cursor:pointer}
.sheet .opt:first-of-type{margin-top:12px}
nav button.on{background:var(--brand-soft);color:var(--brand-ink)}
.item{border-top:1px solid var(--line);padding:12px 0}
.item .row input{padding:8px 12px;min-height:44px}
.thumb{width:48px;height:64px;object-fit:cover;border-radius:10px;background:#000;flex:none}
.bar{height:8px;background:var(--field);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.li{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-of-type{border-top:0}
.catH{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-bottom:8px;border-bottom:1px solid var(--line);font-weight:700}
.catH>span:first-child{display:flex;align-items:center}
.pl{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.catH+.pl{border-top:0}
.chip{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:11px;font-size:16px;margin-right:9px;flex:none;background:var(--field);background:color-mix(in srgb,var(--c) 16%,transparent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
summary{cursor:pointer;color:var(--mut)}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--cardborder);border-radius:24px;width:min(92vw,520px);max-height:86vh;padding:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(8,11,15,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;display:none;z-index:60;max-width:90vw;text-align:center;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
#lock[hidden]{display:none}
.tbar{fill:var(--brand);opacity:.28}.tbar.on{opacity:1}.tlab{fill:var(--mut)}
.pline{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.pdot{fill:var(--brand)}
.ask{display:flex;gap:8px;margin-top:10px}.ask input{flex:1}.ask .btn{margin:0;flex:none}
.note{background:var(--brand-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:14px;margin:10px 0}
#cropper{position:fixed;inset:0;z-index:40;background:#0A0D12;display:flex;flex-direction:column;color:#fff}
#cropper[hidden]{display:none}
.cr-top{padding:calc(14px + env(safe-area-inset-top)) 18px 8px}
.cr-top b{display:block;font-size:18px}
.cr-top span{font-size:13px;color:rgba(255,255,255,.7)}
.cr-stage{flex:1;position:relative;min-height:0}
.cr-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.cr-bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
.cr-bar .btn{margin:0}
.cr-bar .btn.alt{background:rgba(255,255,255,.14);color:#fff}
.fstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.fstats div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 8px;text-align:center}
.fstats b{display:block;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fstats span{font-size:11.5px;color:rgba(255,255,255,.72)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0 4px}
.chk label{font-size:15px;line-height:1.3}
.lnk{color:var(--brand-ink);font-size:13px;font-weight:700;margin-top:4px;cursor:pointer}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand-ink);vertical-align:middle}
.badge.bad{background:var(--field);background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.vr{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.vr:first-of-type{border-top:0}
.vr .px{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.aitext{white-space:pre-wrap;font-size:15px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav">
  <button data-tab="fisler"><span>🧾</span>Fişler</button>
  <button data-tab="yakit"><span>⛽</span>Yakıt</button>
  <button data-tab="add" class="fab" aria-label="Fiş ekle"><span>📷</span></button>
  <button data-tab="rapor"><span>📊</span>Rapor</button>
  <button data-tab="ayar"><span>⚙️</span>Ayarlar</button>
</nav>
<dialog id="dlg"></dialog>
<div id="cropper" hidden></div>
<div id="toast"></div>
<div id="lock" hidden>
  <div style="font-size:40px">🔒</div><b>Fiş Arşivi</b>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="max-width:220px;text-align:center;font-size:20px">
  <button class="btn" id="unlock" style="max-width:220px">Aç</button>
  <div id="pinerr" class="err"></div>
</div>

<script>
'use strict';
/* ================= yardımcılar ================= */
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TRY = n => (Number(n) || 0).toLocaleString('tr-TR', {style:'currency', currency:'TRY'});
const num = v => { if (typeof v === 'string') v = parseFloat(v.replace(',', '.')); return Number.isFinite(v) ? v : 0; };
const today = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const validDate = d => /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? d : '';
const dayNum = d => { const [y,m,dd] = d.split('-').map(Number); return Date.UTC(y, m-1, dd) / 864e5; };
const key = s => String(s || '').toLocaleLowerCase('tr').trim();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};
const CATS = ['Meyve-Sebze','Et-Tavuk-Balık','Süt-Kahvaltılık','Fırın','Bakliyat-Makarna','Yağ-Sos-Baharat','İçecek','Atıştırmalık','Tatlı-Çikolata','Temizlik','Kişisel Bakım','Diğer'];
const CAT_ICON = {'Meyve-Sebze':'🥬','Et-Tavuk-Balık':'🍗','Süt-Kahvaltılık':'🥛','Fırın':'🍞','Bakliyat-Makarna':'🍝','Yağ-Sos-Baharat':'🫒','İçecek':'🥤','Atıştırmalık':'🍪','Tatlı-Çikolata':'🍫','Temizlik':'🧽','Kişisel Bakım':'🧴','Diğer':'📦'};
const CAT_COLOR = {'Meyve-Sebze':'#16A34A','Et-Tavuk-Balık':'#DC2626','Süt-Kahvaltılık':'#2563EB','Fırın':'#D97706','Bakliyat-Makarna':'#CA8A04','Yağ-Sos-Baharat':'#65A30D','İçecek':'#0891B2','Atıştırmalık':'#EA580C','Tatlı-Çikolata':'#DB2777','Temizlik':'#0D9488','Kişisel Bakım':'#7C3AED','Diğer':'#64748B'};
const catChip = c => `<span class="chip" style="--c:${CAT_COLOR[c] || '#64748B'}">${CAT_ICON[c] || ''}</span>`;
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DAYS = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const monthName = k => { const [y,m] = k.split('-'); return MONTHS[+m-1] + ' ' + y; };
const prevMonth = k => { const [y,m] = k.split('-').map(Number); const d = new Date(y, m-2, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const fmtDate = d => { const [y,m,dd] = d.split('-').map(Number); return dd + ' ' + MONTHS[m-1] + ' ' + y + ', ' + DAYS[new Date(y, m-1, dd).getDay()]; };
const shortDate = d => { const [y,m,dd] = d.split('-').map(Number); return dd + ' ' + MONTHS[m-1].slice(0,3) + ' ' + y; };
function toast(t){ const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 3200); }

/* birim ve ürün anahtarı: kg ile adet fiyatları karışmasın */
const uk = u => { u = key(u); return /^(kg|kilo|kilogram|g|gr|gram)$/.test(u) ? 'kg' : /^(lt|l|litre|ml)$/.test(u) ? 'lt' : 'adet'; };
const pkey = it => key(it.generic || it.name) + '|' + uk(it.unit);
const pname = id => id.split('|')[0];

/* market adı */
const STORES = {'bim':'BİM','bım':'BİM','a101':'A101','şok':'ŞOK','sok':'ŞOK','migros':'Migros','carrefoursa':'CarrefourSA','carrefour':'CarrefourSA'};
const knownStores = () => LS.get('stores', []);
function learnStore(s){ if (!s) return; const a = knownStores(); if (a.some(k => key(k) === key(s))) return; a.push(s); LS.set('stores', a); }
function normStore(s){ s = String(s || '').trim(); const l = key(s);
  const kn = knownStores().find(k => key(k) === l); if (kn) return kn;
  for (const k in STORES) if (new RegExp('^' + k + '([^a-z0-9çğıöşü]|$)').test(l)) return STORES[k];
  return s; }
const storeMap = () => LS.get('storemap', {});
function learnStoreRaw(raw, store){ raw = key(raw); if (!raw || !store) return; const m = storeMap(); m[raw] = store; LS.set('storemap', m); }
function dateWarn(d){
  if (!validDate(d)) return 'Tarih okunamadı, lütfen gir.';
  if (d > today()) return 'Tarih bugünden ileride, kontrol et.';
  if (d < new Date(Date.now() - 400*864e5).toISOString().slice(0,10)) return 'Tarih bir yıldan eski görünüyor, kontrol et.';
  return ''; }

/* öğrenme hafızası */
const catMap = () => LS.get('catmap', {});
const nameMap = () => LS.get('namemap', {});
const genMap = () => LS.get('genmap', {});
function learnCats(items){ const m = catMap(); items.forEach(i => { const k = key(i.generic || i.name); if (k && i.category) m[k] = i.category; }); LS.set('catmap', m); }
function learnNames(items){ const m = nameMap();
  items.forEach(i => { if (i.raw) m[key(i.raw)] = {name:i.name, brand:i.brand || '', generic:i.generic, category:i.category}; }); LS.set('namemap', m); }

/* ================= IndexedDB ================= */
const DB = {
  db:null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('fis-arsivi', 3);
    r.onupgradeneeded = () => { const d = r.result;
      if (!d.objectStoreNames.contains('receipts')) d.createObjectStore('receipts', {keyPath:'id'});
      if (!d.objectStoreNames.contains('queue')) d.createObjectStore('queue', {keyPath:'id'});
      if (!d.objectStoreNames.contains('fuel')) d.createObjectStore('fuel', {keyPath:'id'}); };
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  req(q){ return new Promise((res, rej) => { q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  st(n, mode){ return this.db.transaction(n, mode).objectStore(n); },
  all(n = 'receipts'){ return this.req(this.st(n, 'readonly').getAll()); },
  put(o, n = 'receipts'){ return this.req(this.st(n, 'readwrite').put(o)); },
  del(id, n = 'receipts'){ return this.req(this.st(n, 'readwrite').delete(id)); },
  clear(n = 'receipts'){ return this.req(this.st(n, 'readwrite').clear()); }
};

/* ================= Gemini ================= */
const examples = () => {
  const arr = Object.entries(nameMap()).slice(-40); if (!arr.length) return '';
  return '\nKullanıcının daha önce doğruladığı eşleştirmeler (fişteki yazım → ad | genel ad | kategori). Aynı veya benzer yazım görürsen bunlara uy:\n'
    + arr.map(([k, v]) => `${k.slice(0, 60)} → ${String(v.name).slice(0, 60)} | ${String(v.generic).slice(0, 40)} | ${v.category}`).join('\n'); };
function buildPrompt(n){
  return `Bu bir Türkiye market fişi fotoğrafı${n > 1 ? ` (${n} fotoğraf, aynı fişin parçaları, yukarıdan aşağıya sırayla; tek fiş olarak oku, üst üste binen satırları iki kez sayma)` : ''}. Fişi oku ve SADECE aşağıdaki JSON'u döndür:
{"store":"market adı","store_raw":"","branch":"","date":"YYYY-MM-DD","time":"HH:MM","payment":"","total":0,"discount_total":0,"items":[{"raw":"fişte yazdığı gibi, aynen","name":"fişteki ürün adı (okunaklı hale getir)","uncertain":false,"brand":"","generic":"markasız genel ürün adı, küçük harf, paket boyutuyla, örn: süt 1 lt, domates, ekmek, deterjan 4 kg","qty":1,"unit":"adet|kg|lt","unit_price":0,"discount":0,"line_total":0,"category":"..."}]}
Kurallar:
- Tutarlar TL, ondalık ayırıcı nokta olan sayı olsun.
- Kiloyla satılan ürünlerde qty kg cinsinden, unit_price kg fiyatı olsun.
- İndirim/kampanya satırı varsa ilgili ürünün line_total değerine yansıt; ayrı ürün olarak ekleme.

async function gemini(body){
  const k = localStorage.getItem('gkey'); if (!k) { const e = new Error('API anahtarı girilmemiş'); e.fatal = true; throw e; }
  const first = (localStorage.getItem('gmodel') || 'gemini-flash-latest').trim();
  const models = [...new Set([first, 'gemini-flash-latest', 'gemini-flash-lite-latest'])];
  let lastErr = null;
  for (const m of models) {
    for (let a = 0; a < 3; a++) {
      let r;
      try { r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,
        {method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':k}, body:JSON.stringify(body)}); }
      catch(e) { lastErr = new Error('Google\'a ulaşılamadı (internet?)'); await sleep(a ? 6000 : 2500); continue; }
      if (r.ok) return r.json();
      let msg = ''; try { msg = (await r.json()).error.message; } catch(e) {}
      if (r.status === 404) { lastErr = new Error('Model bulunamadı: ' + m); break; }
      if (r.status === 429 || r.status >= 500) { lastErr = new Error(r.status === 429 ? 'Ücretsiz kota veya dakikalık sınır doldu' : 'Google geçici hata verdi (' + r.status + ')'); await sleep(a ? 9000 : 3000); continue; }
      const e = new Error('Gemini ' + r.status + ': ' + msg); e.fatal = true; throw e;
    }
  }
  throw lastErr || new Error('Bilinmeyen hata');
}

async function analyzeChecked(b64s){
  const data = await analyze(b64s); const t = num(data.total);
  if (!t || Math.abs(dsum(data) - t) <= 0.5) return {data, recheck:''};
  const s1 = dsum(data), d1 = Math.abs(s1 - t);
  try {
    const prev = JSON.stringify({total:data.total, items:(data.items || []).map(i => ({raw:i.raw, name:i.name, qty:i.qty, line_total:i.line_total}))}).slice(0, 6000);
    const hint = `\n\nİKİNCİ KONTROL: Önceki okumanda ürün satırlarının toplamı ${s1.toFixed(2)} TL, fiş toplamı ${t.toFixed(2)} TL çıktı; fark ${(t - s1).toFixed(2)} TL. Önceki okuma (hatalı olabilir): ${prev}\nFişi baştan, satır satır dikkatle oku. Atladığın satırı (ücretli poşet dahil) ekle, yanlış okuduğun tutarı düzelt. Fişte olmayan satır uydurma. Aynı JSON formatında TAM sonucu döndür.`;
    const d2 = await analyze(b64s, hint); const t2 = num(d2.total) || t;
    if (Math.abs(t2 - t) <= 0.5 && Math.abs(dsum(d2) - t) < d1) return {data:d2, recheck:Math.abs(dsum(d2) - t) <= 0.5 ? 'fixed' : 'better'};

  } catch(e) { return {data, recheck:''}; }
}

const METRICS = {spent:'toplam harcama', quantity:'toplam miktar', count_purchases:'kaç fişte alındı', avg_unit_price:'ortalama birim fiyat', min_unit_price:'en düşük birim fiyat', max_unit_price:'en yüksek birim fiyat', last_price:'son birim fiyat'};

async function askData(q, all){

const fmtQty = by => Object.entries(by).map(([u, n]) => n.toLocaleString('tr-TR', {maximumFractionDigits:2}) + ' ' + u).join(' · ') || '0';
function priceStat(ps, m){
  const by = {}; ps.forEach(x => (by[x.u] = by[x.u] || []).push(x));
  return Object.entries(by).map(([u, a]) => { let v, ex = ''; const at = x => `${esc(x.s)} · ${shortDate(x.d)}`;
    if (m === 'avg_unit_price') v = a.reduce((s, x) => s + x.p, 0) / a.length;
    else if (m === 'min_unit_price') { const x = a.reduce((b, c) => c.p < b.p ? c : b); v = x.p; ex = at(x); }
    else if (m === 'max_unit_price') { const x = a.reduce((b, c) => c.p > b.p ? c : b); v = x.p; ex = at(x); }
    else { const x = [...a].sort((p, q) => q.d.localeCompare(p.d))[0]; v = x.p; ex = at(x); }
    return {u, v, ex}; });
}
function runQuery(all, sp){
  const m = METRICS[sp.metric] ? sp.metric : 'spent', g = GROUPS.includes(sp.group_by) ? sp.group_by : 'none';
  const pq = key(sp.product), from = validDate(sp.from), to = validDate(sp.to), cat = CATS.includes(sp.category) ? sp.category : '', st = sp.store ? key(normStore(sp.store)) : '';
  const lines = [];
  for (const r of all) { if (from && r.date < from) continue; if (to && r.date > to) continue; if (st && key(normStore(r.store)) !== st) continue;
    for (const it of r.items) { if (cat && it.category !== cat) continue;
      if (pq && ![it.generic, it.name, it.brand].some(x => key(x).includes(pq))) continue;
      lines.push({r, it}); } }
  const B = {};
  for (const {r, it} of lines) { const k = g === 'month' ? r.date.slice(0, 7) : g === 'store' ? normStore(r.store) : g === 'category' ? it.category : g === 'product' ? key(it.generic || it.name) : 'Toplam';
    const o = B[k] = B[k] || {spent:0, qty:{}, rc:new Set(), ps:[], n:0}; o.n++; o.spent += it.line_total || 0; const u = uk(it.unit); o.qty[u] = (o.qty[u] || 0) + (it.qty || 0);

  if (g === 'month') rows.sort((a, b) => a.label.localeCompare(b.label)); else rows.sort((a, b) => (m === 'min_unit_price' ? a.sort - b.sort : b.sort - a.sort));
  const top = Math.round(num(sp.top)); if (top > 0 && g !== 'none') rows = rows.slice(0, Math.min(top, 20));
  if (g === 'month') rows.forEach(r => r.label = monthName(r.label));
  if (g === 'category') rows.forEach(r => r.label = r.label);
  return {rows, lines, m, g};
}

async function findMerges(){
  const all = await DB.all(), cnt = {};
  all.forEach(r => r.items.forEach(i => { const g = key(i.generic || i.name); if (g) cnt[g] = (cnt[g] || 0) + 1; }));
  const list = Object.keys(cnt).sort().slice(0, 300); if (list.length < 2) return {groups:[], cnt};
  const prompt = `Aşağıda market fişlerinden toplanmış "genel ürün adları" var. Aynı ürünü anlatan ve yalnızca yazım, kısaltma veya marka farkı olan adları grupla. Paket boyutu veya ürün çeşidi farklıysa (süt 1 lt ile süt 200 ml; beyaz peynir ile kaşar peyniri; domates ile salkım domates) ASLA birleştirme. Emin olmadığın grubu yazma. Her grup için en okunaklı kısa ortak adı "canonical" olarak seç (küçük harf). SADECE JSON döndür: {"groups":[{"canonical":"süt 1 lt","members":["süt 1lt","pınar süt 1 lt"]}]}\nAdlar:\n${list.join('\n')}`;
  const d = parseJ(await gemini({contents:[{parts:[{text:prompt}]}], generationConfig:{responseMimeType:'application/json', temperature:0}}));
  const used = new Set(), groups = [];
  (Array.isArray(d.groups) ? d.groups : []).forEach(g => {
    const mem = [...new Set((Array.isArray(g.members) ? g.members : []).map(key).filter(x => cnt[x] && !used.has(x)))];
    const can = key(g.canonical); if (mem.length < 2 || !can) return; mem.forEach(x => used.add(x)); groups.push({canonical:can, members:mem}); });
  return {groups, cnt};
}

/* ================= ÜRÜN KARŞILAŞTIRMA (marka / boyut / fiyat) ================= */
const pinfoMap = () => LS.get('pinfo', {});
const ikey = it => key(it.name) + '|' + key(it.brand) + '|' + key(it.generic);
const cap = t => t ? t.charAt(0).toLocaleUpperCase('tr') + t.slice(1) : t;
const SIZE_RE = /(\d+(?:[.,]\d+)?)\s*(kg|kilo|kilogram|gr|gram|g|lt|litre|l|ml|cl)(?![a-zçğıöşü])/i;
const PACK_RE = /(\d+)\s*['’]?\s*(li|lı|lu|lü)(?![a-zçğıöşü])/i;
const BASE_LABEL = {kg:'kg', lt:'lt', adet:'adet'};
const fmtN = n => (Number(n) || 0).toLocaleString('tr-TR', {maximumFractionDigits:3});
function parseSize(...texts){
  for (const t of texts) { const s = key(t); if (!s) continue;
    const m = s.match(SIZE_RE);
    if (m) { let u = m[2].toLowerCase(); u = /^(kg|kilo|kilogram)$/.test(u) ? 'kg' : /^(gr|gram|g)$/.test(u) ? 'g' : /^(lt|litre|l)$/.test(u) ? 'lt' : u;
      return {size:parseFloat(m[1].replace(',', '.')), size_unit:u, pack:1}; }
    const q = s.match(PACK_RE); if (q) return {size:+q[1], size_unit:'adet', pack:1}; }
  return {size:0, size_unit:'', pack:1};
}
function heurInfo(it){
  const t = key(it.generic || it.name).replace(new RegExp(SIZE_RE.source, 'gi'), ' ').replace(new RegExp(PACK_RE.source, 'gi'), ' ').replace(/%\s*\d+/g, ' ').replace(/\s+/g, ' ').trim();
  return {type:t, brand:it.brand || '', detail:'', ...parseSize(it.generic, it.name, it.raw), src:'auto'};
}
function getInfo(it, pi){
  const a = pi[ikey(it)], h = heurInfo(it); if (!a) return h;
  if (a.src === 'user') return {type:a.type || h.type, brand:a.brand || '', detail:a.detail || '', size:a.size || 0, size_unit:a.size_unit || '', pack:a.pack || 1, src:'user'};
  const ok = a.size > 0 && a.size_unit;
  return {type:a.type || h.type, brand:a.brand || h.brand || '', detail:a.detail || '', size:ok ? a.size : h.size, size_unit:ok ? a.size_unit : h.size_unit, pack:ok ? (a.pack || 1) : 1, src:a.src};
}
function packAmount(info){
  const t = info.size * (info.pack || 1); if (!(t > 0)) return null;
  return ({kg:{base:'kg', amt:t}, g:{base:'kg', amt:t / 1000}, lt:{base:'lt', amt:t}, ml:{base:'lt', amt:t / 1000}, cl:{base:'lt', amt:t / 100}, adet:{base:'adet', amt:t}})[info.size_unit] || null;
}
const sizeLabel = info => { const u = info.size_unit; return info.size > 0 && u ? `${(info.pack || 1) > 1 ? info.pack + '×' : ''}${fmtN(info.size)} ${u}` : ''; };
/* tek ürün satırını ortak birime (₺/lt, ₺/kg, ₺/adet) çevirir; paket boyutu bilinmiyorsa known:false */
function normOf(it, info){
  const u = uk(it.unit);
  if (u === 'kg' || u === 'lt') return {base:u, price:it.unit_price, known:true, sizeLabel:u};
  const pa = packAmount(info); if (pa) return {base:pa.base, price:it.unit_price / pa.amt, known:true, sizeLabel:sizeLabel(info)};
  return {base:'adet', price:it.unit_price, known:false, sizeLabel:''};
}
function buildCompare(all){
  const pi = pinfoMap(), types = {};
  for (const r of all) for (const it of r.items) {
    if (!(it.unit_price > 0)) continue; const info = getInfo(it, pi); if (!info.type) continue; const n = normOf(it, info);
    const T = types[info.type] = types[info.type] || {type:info.type, groups:{}, n:0, spent:0}; T.n++; T.spent += it.line_total || 0;
    const gk = n.base + (n.known ? '' : '?'), G = T.groups[gk] = T.groups[gk] || {gk, base:n.base, known:n.known, vars:{}};
    const vk = key(info.brand || it.name) + '|' + n.sizeLabel;
    const V = G.vars[vk] = G.vars[vk] || {vk, title:info.brand || it.name, hasBrand:!!info.brand, sizeLabel:n.sizeLabel, detail:info.detail, info, pts:[], pks:new Set()};
    V.pts.push({d:r.date, s:r.store, p:n.price, pack:it.unit_price}); V.pks.add(ikey(it)); }
  for (const T of Object.values(types)) for (const G of Object.values(T.groups)) {
    G.list = Object.values(G.vars).map(V => { V.pts.sort((a, b) => a.d.localeCompare(b.d)); V.last = V.pts[V.pts.length - 1]; V.avg = V.pts.reduce((s, x) => s + x.p, 0) / V.pts.length; return V; }).sort((a, b) => a.last.p - b.last.p); }
  return types;
}
const comparable = T => Object.values(T.groups).some(G => G.known && G.list.length >= 2);
function comparableTypes(all){ const B = buildCompare(all); return new Set(Object.values(B).filter(comparable).map(T => T.type)); }
const cmpLink = it => { const t = getInfo(it, pinfoMap()).type; return t && cmpSet.has(t) ? `<div class="lnk" data-act="cmp" data-t="${esc(t)}">⚖️ Markaları karşılaştır</div>` : ''; };
const mainGroup = T => Object.values(T.groups).filter(G => G.known && G.list.length >= 2).sort((a, b) => b.list.length - a.list.length)[0];

/* ---- yapay zeka: ürün satırlarından marka, boyut ve ürün cinsini çıkarır (fiyat hesabını uygulama yapar) ---- */
async function geminiText(prompt){
  const j = await gemini({contents:[{parts:[{text:prompt}]}], generationConfig:{temperature:0.2}});
  return (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
}
function cleanInfo(o){
  const su = ['kg', 'g', 'lt', 'ml', 'cl', 'adet'].includes(String(o.size_unit).toLowerCase()) ? String(o.size_unit).toLowerCase() : '';
  const size = Math.max(0, num(o.size)), ok = su && size > 0 && size < 100000;
  return {type:key(o.type).slice(0, 40), brand:String(o.brand || '').trim().slice(0, 40), detail:String(o.detail || '').trim().slice(0, 40),
          size:ok ? size : 0, size_unit:ok ? su : '', pack:ok ? Math.min(100, Math.max(1, Math.round(num(o.pack) || 1))) : 1, src:'ai'};
}
function needEnrich(all){ const pi = pinfoMap(), m = new Map();
  for (const r of all) for (const it of r.items) { const k = ikey(it); if (!pi[k] && !m.has(k) && (it.name || it.generic)) m.set(k, it); }
  return m; }
async function enrichProducts(all){
  let total = 0;
  for (let b = 0; b < 4; b++) {
    const pi = pinfoMap(), need = [...needEnrich(all).entries()].slice(0, 50); if (!need.length) break;
    const types = [...new Set(all.flatMap(r => r.items.map(it => getInfo(it, pi).type)).filter(Boolean))].slice(0, 80);
    const prompt = `Aşağıda market fişlerinden ürün satırları var. Her biri için ürün cinsini, markasını ve paket boyutunu çıkar. SADECE JSON döndür:
{"items":[{"id":0,"type":"süt","brand":"Pınar","detail":"yarım yağlı","size":1,"size_unit":"lt","pack":1}]}
Kurallar:
- type: markasız ve boyutsuz kısa ürün cinsi, küçük harf (süt, yoğurt, yumurta, zeytinyağı, ayçiçek yağı, makarna, çamaşır suyu gibi). Mevcut cinsler: ${types.join(', ') || '(yok)'}. Aynı ürün cinsi için bunlardan birini kullan; sadece gerçekten farklı bir ürünse yeni cins yaz. Çeşit farklarını (yarım yağlı, laktozsuz, tam yağlı, sızma) detail alanına yaz, cinsi bölme.
- brand: ürün adından anlaşılan marka (Pınar, Sek, Sütaş, Ülker gibi). Markayı adda göremiyorsan boş bırak, tahmin uydurma. Bilinen yazım kısaltmalarını aç (SUT → süt, PNR → Pınar gibi, ama emin değilsen boş bırak).
- size, size_unit: paket boyutu. size_unit yalnızca kg, g, lt, ml, cl veya adet olabilir. "1 L", "1LT", "1000 ML" gibi yazımları buna çevir. Yumurta gibi adetle satılanlarda size_unit adet ve size adet sayısıdır (15'li → 15 adet). "6'lı 1 lt" gibi çoklu pakette size 1, size_unit lt, pack 6. Boyutu adda göremiyorsan size 0 yaz; satış birimi kg/lt olan (tartılan) ürünlerde de size 0 yaz.
Satırlar:
${need.map(([k, it], i) => `${i} | ad: ${it.name} | fişte: ${it.raw || ''} | genel: ${it.generic || ''} | marka: ${it.brand || ''} | satış birimi: ${it.unit} | birim fiyat: ${it.unit_price}`).join('\n')}`;
    const d = parseJ(await gemini({contents:[{parts:[{text:prompt}]}], generationConfig:{responseMimeType:'application/json', temperature:0}}));
    const out = Array.isArray(d.items) ? d.items : [], fresh = pinfoMap(); let n = 0;

}

    <div class="sub">Düzelttiğin ürün adları ve kategoriler hatırlanır; sonraki fişlerde uygulanır ve Gemini'ye örnek olarak gönderilir.</div>
    <button class="btn alt sm" data-act="wipemem">Öğrenilenleri sıfırla</button></div>
  <div class="card"><b>Ürün adlarını birleştir</b>
    <p class="mut">Aynı ürünün farklı yazımlarını ("süt 1lt", "pınar süt 1 lt") yapay zeka bulur, sen onaylarsın. Fiyat geçmişi ve enflasyon hesabı daha doğru olur.</p>
    <button class="btn alt" data-act="mergefind">🔎 Benzer ürünleri bul</button></div>
  <div class="card"><b>Bütçe</b>
    <label class="f">Aylık toplam (TL)</label><input id="bt" inputmode="decimal" value="${b.total || ''}">
    <details style="margin-top:8px"><summary>Kategori bütçeleri (isteğe bağlı)</summary>${CATS.map(c => `<label class="f">${CAT_ICON[c]} ${c}</label><input data-bc="${esc(c)}" inputmode="decimal" value="${bc[c] || ''}">`).join('')}</details>
    <button class="btn" data-act="savebudget">Bütçeyi kaydet</button></div>
  <div class="card"><b>Araç</b>
    <label class="f">Araç adı (isteğe bağlı)</label><input id="vname" placeholder="Örn. Renault Clio" value="${esc(vehicle().name || '')}">
    <label class="f">Genelde aldığın yakıt</label><select id="vfuel">${FUELS.map(x => `<option ${x === (vehicle().fuel || 'Benzin') ? 'selected' : ''}>${x}</option>`).join('')}</select>
    <button class="btn" data-act="savevehicle">Kaydet</button>
    <button class="btn alt" data-act="fexportcsv">Yakıt kayıtlarını indir (CSV)</button>
    <button class="btn bad" data-act="fwipe">Yakıt kayıtlarını sil</button></div>
  <div class="card"><b>Veri (${all.length} fiş)</b>
    <div class="sub">Son yedek: ${lb ? shortDate(lb) : 'yok'}</div>
    <button class="btn alt" data-act="exportjson">Yedek indir (JSON, hafıza dahil)</button>
    <button class="btn alt" data-act="exportcsv">Excel için indir (CSV)</button>
    <label class="btn alt">Yedekten geri yükle<input id="imp" type="file" accept=".json,application/json" hidden></label>
    <button class="btn alt" data-act="persist">${persisted ? '✅ Kalıcı depolama açık' : 'Verilerin silinmesine karşı koru'}</button>
    <button class="btn bad" data-act="wipe">Tüm fişleri sil</button></div>
  <div class="card"><b>PIN kilidi</b>
    <p class="mut">${pinHash() ? 'PIN kilidi açık.' : 'Telefonu başkası kullanıyorsa uygulama açılırken PIN sorar.'} Bu yalnızca bir ekran kilididir, veriyi şifrelemez. PIN'i unutursan tek çıkış site verisini silmektir ve fişlerin gider; önce yedek al.</p>
    <input id="pin1" type="password" inputmode="numeric" placeholder="${pinHash() ? 'Mevcut PIN' : '4-8 haneli yeni PIN'}">
    ${pinHash() ? '<button class="btn alt" data-act="rmpin">PIN\'i kaldır</button>' : '<button class="btn" data-act="setpin">PIN koy</button>'}</div>
  <p class="mut">Veriler tarayıcı içinde saklanır. Tarayıcı verilerini temizlersen veya uygulamayı kaldırırsan gider; arada bir yedek indir.</p>`;
  $('#imp').onchange = async e => { try { const j = JSON.parse(await e.target.files[0].text()); const recs = Array.isArray(j) ? j : (j.receipts || []); let n = 0, bad = 0, fn = 0;
    for (const r of recs) { if (r && r.id && validDate(r.date) && Array.isArray(r.items)) { await DB.put(r); n++; } else bad++; }
    if (!Array.isArray(j)) { if (Array.isArray(j.fuel)) for (const f of j.fuel) { if (f && f.id && validDate(f.date) && f.total >= 0) { await DB.put(f, 'fuel'); fn++; } } if (j.vehicle) LS.set('vehicle', j.vehicle); if (Array.isArray(j.fstations)) j.fstations.forEach(learnStation); if (j.catmap) LS.set('catmap', {...catMap(), ...j.catmap}); if (j.namemap) LS.set('namemap', {...nameMap(), ...j.namemap}); if (j.storemap) LS.set('storemap', {...storeMap(), ...j.storemap}); if (j.genmap) LS.set('genmap', {...genMap(), ...j.genmap}); if (j.pinfo) LS.set('pinfo', {...pinfoMap(), ...j.pinfo});
      if (Array.isArray(j.stores)) j.stores.forEach(learnStore); if (j.budget && !(LS.get('budget', null)?.total)) LS.set('budget', j.budget); }
    toast(n + ' fiş' + (fn ? ', ' + fn + ' yakıt kaydı' : '') + ' yüklendi' + (bad ? `, ${bad} kayıt atlandı` : '')); renderSettings(); } catch(err) { toast('Geçersiz yedek dosyası'); } };
}
function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

/* ================= olaylar ================= */
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'askq') doAsk(); });
document.addEventListener('input', e => { if (e.target.id === 'q') { qText = e.target.value; fillList(); return; } onInput(e); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'month') { repMonth = t.value; renderReport(); }
  else if (t.id === 'qsel') { qStore = t.value; fillList(); }
  else if (t.id === 'themesel') { localStorage.setItem('theme', t.value); applyTheme(); }
  else if (t.dataset.fk && fdraft) { onInput(e); if (t.dataset.fk === 'fuel') updateFuelWarn(); }
  else { onInput(e); if (t.dataset.f === 'category' && draft) { const y = scrollY; renderReview(); scrollTo(0, y); } } });
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) { if (b.dataset.tab === 'add') { if (draft || photos.length) { detailId = null; return show('ekle'); } return openSheet(); } if (b.dataset.tab === 'yakit' && tab === 'yakit') { fdraft = null; fph = []; } detailId = null; cmpType = null; show(b.dataset.tab); } };
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  const a = el.dataset.act;
  if (a === 'manual') { closeSheet(); draft = {id:crypto.randomUUID(), thumb:'', store:'', date:today(), items:[], total:0, isNew:true}; show('ekle'); }
  else if (a === 'addrow') { draft.items.push(normItem({name:'', qty:1})); renderReview(); }
  else if (a === 'adddiff') { const f = +(draft.total - itemsSum(draft)).toFixed(2); if (f > 0) { const bag = f <= 5;
    draft.items.push(normItem({name:bag ? 'Poşet' : 'Diğer', generic:bag ? 'poşet' : 'diğer', qty:1, unit:'adet', line_total:f, category:'Diğer'})); } renderReview(); }
  else if (a === 'rm') { draft.items.splice(+el.dataset.i, 1); renderReview(); }
  else if (a === 'cancel') { const was = draft; draft = null; if (was && !was.isNew) { detailId = was.id; show(detailFrom); } else { detailId = null; show('fisler'); } }
  else if (a === 'save') {
    if (!validDate(draft.date)) { toast('Tarih gerekli'); return; }
    draft.store = normStore(draft.store);
    draft.items = draft.items.filter(i => i.name || i.line_total);
    const acc = calcAcc(draft);
    if (!draft.total) draft.total = +itemsSum(draft).toFixed(2);
    const wasNew = draft.isNew;
    if (wasNew) { const dup = await findDup(draft); if (dup && !confirm('Aynı market, gün ve tutarda başka bir fiş var. Yine de kaydedilsin mi?')) return; }
    const r = {...draft}; delete r.isNew; delete r.ai; delete r.dupOf; delete r.recheck; const fq = r.fromQueue; delete r.fromQueue;
    if (acc) r.acc = acc; if (!r.created) r.created = Date.now();
    await DB.put(r); if (fq) await DB.del(fq, 'queue');
    learnCats(r.items); learnNames(r.items); learnStore(r.store); learnStoreRaw(r.store_raw, r.store);
    const msg = await budgetAlert(r);
    draft = null; detailId = r.id; if (wasNew) detailFrom = 'fisler';
    toast('Kaydedildi' + (msg ? ' — ' + msg : '')); show(detailFrom); }
  else if (a === 'delete') { if (confirm('Bu fiş silinsin mi?')) { await DB.del(draft.id); draft = null; detailId = null; show(detailFrom); } }
  else if (a === 'view') { detailId = el.dataset.id; detailFrom = tab; show(tab); }
  else if (a === 'back') { detailId = null; show(tab); }
  else if (a === 'all') { show('fisler'); }
  else if (a === 'edit') { const r = (await DB.all()).find(x => x.id === detailId); if (!r) return; draft = JSON.parse(JSON.stringify(r)); show('ekle'); }
  else if (a === 'delview') { if (confirm('Bu fiş silinsin mi?')) { await DB.del(detailId); detailId = null; show(tab); } }
  else if (a === 'prod') productDetail(el.dataset.k);
  else if (a === 'close') $('#dlg').close();
  else if (a === 'setmonth') { const m = el.dataset.m; if ((await DB.all()).some(r => r.date.startsWith(m))) { repMonth = m; renderReport(); } else toast('Bu ayda fiş yok'); }
  else if (a === 'read') doRead();
  else if (a === 'crop') openCrop(+el.dataset.i);
  else if (a === 'rmphoto') { photos.splice(+el.dataset.i, 1); renderAdd(); }
  else if (a === 'cancelphotos') { photos = []; renderAdd(); }
  else if (a === 'qread') readQueue(el.dataset.id);
  else if (a === 'qmanual') { const q = (await DB.all('queue')).find(x => x.id === el.dataset.id); if (!q) return;
    draft = {id:crypto.randomUUID(), thumb:q.thumb, store:'', date:today(), items:[], total:0, isNew:true, fromQueue:q.id}; show('ekle'); }
  else if (a === 'qdel') { if (confirm('Bekleyen fotoğraf silinsin mi?')) { await DB.del(el.dataset.id, 'queue'); fillQueue(); } }
  else if (a === 'fmanual2') { closeSheet(); fdraft = newFuel(); show('yakit'); }
  else if (a === 'fmanual') { fdraft = newFuel(); show('yakit'); }
  else if (a === 'fread') readFuel();
  else if (a === 'fcrop') openCrop(0, fph, renderFuelPrep);
  else if (a === 'fcancelphoto') { fph = []; renderFuel(); }
  else if (a === 'fsave') saveFuel();
  else if (a === 'fcancel') { fdraft = null; fph = []; renderFuel(); }
  else if (a === 'fdelete') { if (confirm('Bu yakıt kaydı silinsin mi?')) { await DB.del(fdraft.id, 'fuel'); fdraft = null; renderFuel(); } }
  else if (a === 'ffix') fuelFix(el.dataset.w);
  else if (a === 'fedit') { const r = (await DB.all('fuel')).find(x => x.id === el.dataset.id); if (r) { fdraft = JSON.parse(JSON.stringify(r)); fdraft.isNew = false; renderFuel(); } }
  else if (a === 'fall') { fshowAll = !fshowAll; renderFuel(); }
  else if (a === 'savevehicle') { LS.set('vehicle', {name:$('#vname').value.trim(), fuel:$('#vfuel').value}); toast('Araç bilgisi kaydedildi'); }
  else if (a === 'fexportcsv') { const rows = [['tarih','istasyon','yakit','miktar','birim_fiyat','tutar','km','depo_dolu','not']];
    (await DB.all('fuel')).sort((x, y) => x.date.localeCompare(y.date)).forEach(r => rows.push([r.date, r.station, r.fuel, r.liters, r.unit_price, r.total, r.odo || '', r.full ? 'evet' : 'hayır', r.note || '']));
    download('yakit-' + today() + '.csv', '\ufeff' + rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(';')).join('\n'), 'text/csv'); }
  else if (a === 'fwipe') { if (confirm('TÜM yakıt kayıtları silinecek. Emin misin?')) { await DB.clear('fuel'); toast('Yakıt kayıtları silindi'); renderSettings(); } }
  else if (a === 'cmp') { cmpFrom = tab; cmpType = el.dataset.t; show('rapor'); }
  else if (a === 'cmpback') { cmpType = null; show(cmpFrom); }
  else if (a === 'cmpall') { cmpAll = !cmpAll; renderReport(); }
  else if (a === 'cmpai') doCmpAI();
  else if (a === 'cmpedit') openCmpEdit(el.dataset.g, el.dataset.v);
  else if (a === 'cmpsave') saveCmpEdit();
  else if (a === 'ask') doAsk();
  else if (a === 'mergefind') { if (!localStorage.getItem('gkey')) return toast('Önce API anahtarını gir'); if (busy) return; busy = true; toast('⏳ Ürünler inceleniyor…');
    try { const res = await findMerges(); if (!res.groups.length) toast('Birleştirilecek benzer ürün bulunamadı'); else mergeDialog(res); } catch(e) { toast('Olmadı: ' + e.message); } finally { busy = false; } }
  else if (a === 'mergeapply') { const n = await applyMerges(); $('#dlg').close(); toast(n ? n + ' kalem birleştirildi' : 'Hiçbir şey seçilmedi'); if (tab === 'rapor') renderReport(); }
  else if (a === 'savekey') { localStorage.setItem('gkey', $('#gkey').value.trim()); localStorage.setItem('gmodel', $('#gmodel').value.trim() || 'gemini-flash-latest'); toast('Kaydedildi'); }
  else if (a === 'savebudget') { const cats = {}; document.querySelectorAll('[data-bc]').forEach(i => { const v = num(i.value); if (v > 0) cats[i.dataset.bc] = v; });
    LS.set('budget', {total:num($('#bt').value), cats}); toast('Bütçe kaydedildi'); }
  else if (a === 'exportjson') { download('fis-yedek-' + today() + '.json', JSON.stringify({v:2, exported:new Date().toISOString(), receipts:await DB.all(), fuel:await DB.all('fuel'), vehicle:LS.get('vehicle', null), fstations:LS.get('fstations', []), catmap:catMap(), namemap:nameMap(), storemap:storeMap(), genmap:genMap(), pinfo:pinfoMap(), stores:knownStores(), budget:LS.get('budget', null)}), 'application/json');
    localStorage.setItem('lastBackup', today()); toast('Yedek indirildi'); if (tab === 'ayar') renderSettings(); }
  else if (a === 'exportcsv') { const rows = [['tarih','market','urun','marka','genel_ad','kategori','adet','birim','birim_fiyat','indirim','tutar']];
    (await DB.all()).sort((x, y) => x.date.localeCompare(y.date)).forEach(r => r.items.forEach(i => rows.push([r.date, r.store, i.name, i.brand, i.generic, i.category, i.qty, i.unit, i.unit_price, i.discount, i.line_total])));
    download('fisler-' + today() + '.csv', '﻿' + rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(';')).join('\n'), 'text/csv'); }
  else if (a === 'persist') { const ok = await navigator.storage?.persist?.(); toast(ok ? 'Kalıcı depolama açıldı' : 'Tarayıcı izin vermedi; uygulamayı ana ekrana ekleyip tekrar dene'); renderSettings(); }
  else if (a === 'wipe') { if (confirm('TÜM fişler silinecek. Emin misin?')) { await DB.clear(); toast('Silindi'); renderSettings(); } }
  else if (a === 'wipemem') { if (confirm('Öğrenilen kategori ve ürün adı eşleştirmeleri silinsin mi? Fişlerin silinmez.')) { localStorage.removeItem('catmap'); localStorage.removeItem('namemap'); localStorage.removeItem('storemap'); localStorage.removeItem('genmap'); localStorage.removeItem('pinfo'); localStorage.removeItem('cmpnote'); toast('Sıfırlandı'); } }
  else if (a === 'setpin') { const p = $('#pin1').value.trim(); if (!/^\d{4,8}$/.test(p)) return toast('PIN 4-8 rakam olmalı');
    if (!(crypto.subtle)) return toast('PIN için https gerekir');
    if (!confirm('PIN\'i unutursan uygulamaya giremezsin; tek çıkış site verisini silmektir ve fişlerin gider. Önce yedek aldığından emin ol. Devam edilsin mi?')) return;
    await setPin(p); toast('PIN kilidi açıldı'); renderSettings(); }
  else if (a === 'rmpin') { if (await checkPin($('#pin1').value)) { localStorage.removeItem('pin'); toast('PIN kaldırıldı'); renderSettings(); } else toast('PIN yanlış'); }
});

lock();
/* ================= EKLE MENÜSÜ (ortadaki kamera) ================= */
function closeSheet(){ const e = $('#sheetBg'); if (e) e.remove(); }
function openSheet(){
  closeSheet(); const bg = document.createElement('div'); bg.id = 'sheetBg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="Ekle"><div class="grip"></div><h3>Ne ekleyelim?</h3>
    <div class="tiles">
      <label class="tile"><span>🛒</span>Market fişi<small>Kamerayı aç</small><input id="s1" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="tile"><span>⛽</span>Yakıt fişi<small>Kamerayı aç</small><input id="s3" type="file" accept="image/*" capture="environment" hidden></label>
    </div>
    <label class="opt">🖼️ Market fişi · galeriden seç (birden fazla)<input id="s2" type="file" accept="image/*" multiple hidden></label>
    <label class="opt">🖼️ Yakıt fişi · galeriden seç<input id="s4" type="file" accept="image/*" hidden></label>
    <button class="opt" data-act="manual">✍️ Market fişini elle ekle</button>
    <button class="opt" data-act="fmanual2">✍️ Yakıt kaydını elle ekle</button></div>`;
  bg.onclick = e => { if (e.target === bg) closeSheet(); };
  document.body.appendChild(bg);
  const mk = e => { const f = [...e.target.files]; closeSheet(); detailId = null; cmpType = null; if (f.length) addPhotos(f); };
  const fu = e => { const f = e.target.files[0]; closeSheet(); if (f) addFuelPhoto(f); };
  $('#s1').onchange = $('#s2').onchange = mk; $('#s3').onchange = $('#s4').onchange = fu;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
DB.open().then(() => show('fisler')).catch(() => { view.innerHTML = '<div class="card err">Veritabanı açılamadı. Gizli sekmede olabilirsin; normal sekmede aç.</div>'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
